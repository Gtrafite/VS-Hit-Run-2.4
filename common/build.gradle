architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/vs_hitnrun.accesswidener")
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    annotationProcessor(implementation("io.github.llamalad7:mixinextras-common:$mixin_extras_version"))

    // Valkyrien Skies 2
    modCompileOnly("org.valkyrienskies:valkyrienskies-120-common:${rootProject.vs2_version}") {
        transitive = true
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            groupId = "io.github.kawaiicakes.vs_hitnrun"
            version = project.version
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}
